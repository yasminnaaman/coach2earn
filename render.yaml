services:
  - type: web
    name: coach2earn-api
    runtime: python
    rootDir: server
    buildCommand: python -m pip install -r requirements.txt && python -c "import httpx; import app.main"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BALLCHASING_API_KEY
        sync: false
      - key: STARTGG_TOKEN
        sync: false
      - key: DEMO_MODE
        value: "true"
